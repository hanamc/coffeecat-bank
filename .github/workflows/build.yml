name: Build Bank
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: unzip -q CoffeecatBank-source.zip
      - run: mvn -B package
        working-directory: CoffeecatBank
      - uses: actions/upload-artifact@v4
        with:
          name: CoffeecatBank
          path: CoffeecatBank/target/CoffeecatBank.jar
